<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Island Snow</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP NAVBAR -->
  <nav class="navbar bg-light">
    <div class="container">

      <!-- LEFT ICONS -->
      <ul class="nav">
        <li class="nav-item p-1">
          <a class="nav-link text-dark" href="#">
            <i class="bi bi-facebook"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="nav-link text-dark" href="#">
            <i class="bi bi-twitter"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="nav-link text-dark" href="#">
            <i class="bi bi-instagram"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="nav-link text-dark" href="#">
            <i class="bi bi-youtube"></i>
          </a>
        </li>
      </ul>

      <!-- RIGHT ICONS -->
      <ul class="nav justify-content-end">

        <li class="nav-item p-1">
          <a class="nav-link text-dark" href="#">
            <i class="bi bi-house-fill"></i>
            HOME
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="nav-link text-dark" href="#">
            <i class="bi bi-search"></i>
            SEARCH
          </a>
        </li>

        <li class="nav-item dropdown p-1">
          <a class="nav-link dropdown-toggle text-dark"
             href="#"
             role="button"
             data-bs-toggle="dropdown"
             aria-expanded="false">
            <i class="bi bi-cart-fill"></i>
            MY CART
          </a>

          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" href="#">
                Your cart is currently empty.
              </a>
            </li>
          </ul>
        </li>

      </ul>

    </div>
  </nav>


  <!-- ISLAND SNOW LOGO -->
  <div class="container">

    <div class="row">
      <div class="col">
        <img
          src="experience-islandsnow-bootstrap-logo.png"
          class="img-fluid rounded mx-auto d-block py-1"
          alt="Island Snow Logo">
      </div>
    </div>


    <!-- SECOND MENU -->
    <div class="row justify-content-center pt-4 text-center">

      <div class="col">
        MEN
      </div>

      <div class="col">
        WOMEN
      </div>

      <div class="col">
        KIDS
      </div>

      <div class="col">
        BRANDS
      </div>

      <div class="col">
        SEARCH
      </div>

    </div>


    <!-- MAIN IMAGE -->
    <div class="row justify-content-center">
      <div class="col">
        <img
          src="experience-islandsnow-bootstrap-main.png"
          class="img-fluid"
          alt="Island Snow">
      </div>
    </div>

  </div>


  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
